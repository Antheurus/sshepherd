# The canary service for src/__tests__/canary-leak.test.ts. plant.sh copies this file to
# /opt/canary/docker-compose.yml on both sshd fixtures with the placeholder replaced by the run's
# random canary (and the fixture's project name and container prefix), then starts it from there, so the
# compose file, the container Env and the log lines all carry the canary. Same compose project as the
# smoke fixture: `just smoke-down` removes it too. Each value ends in a two-letter placement tag; the
# test reports which ops reached which tag. `canary-pg` is the psql-connect-error placement: its
# PGHOST names the documentation-range peer and the canary identity host, neither reachable.
# `canary-dburl` is the `kind = "container-env"` pg-target: a psql-capable container whose
# DATABASE_URL reaches the fixture postgres as the read-only role and carries the canary as its
# password (trust auth ignores it), so a URL that leaked anywhere would show the canary.
# `canary-app`/`canary-app-alpine` share each sshd's network namespace, so http://127.0.0.1:80/ on that
# host reaches them: 200 only with `Authorization: Bearer` + API_KEY (the `--auth` value, read from the
# container env and never returned), a Set-Cookie whose value must stay on the host, a JSON body with a
# secret-shaped field, and /slow (4 KiB at 1 KiB/s) so a `ps` sampler sees the request running.
name: __N__

configs:
  canary-app-conf:
    content: |
      server {
        listen 127.0.0.1:80;
        default_type application/json;
        sendfile off;
        location = / {
          if ($$http_authorization != "Bearer __C__ak") { return 401 '{"error":"unauthorized"}'; }
          add_header Set-Cookie "session_token=__C__sc" always;
          return 200 '{"status":"ok","api_token":"__C__hb"}';
        }
        location = /slow {
          if ($$http_authorization != "Bearer __C__ak") { return 401 '{"error":"unauthorized"}'; }
          limit_rate 1024;
          root /srv;
          try_files /slow.txt =404;
        }
      }

x-canary-app: &canary-app
  image: nginx:alpine
  environment:
    API_KEY: __C__ak
  configs:
    - source: canary-app-conf
      target: /etc/nginx/conf.d/default.conf
  entrypoint: ['sh', '-c']
  command:
    - "mkdir -p /srv && head -c 4096 /dev/zero | tr '\\0' x > /srv/slow.txt && exec nginx -g 'daemon off;'"

services:
  canary:
    image: nginx:alpine
    container_name: __X__-canary
    environment:
      API_TOKEN: __C__ev
      DATABASE_URL: postgres://app:__C__du@postgres:5432/app
      POSTGRES_PASSWORD: __C__cf
      APP_PASSWORD: __C__lg
      BEARER_TOKEN: __C__ah
      CALLBACK_TOKEN: __C__qs
      OAUTH_CLIENT_SECRET: __C__js
      JAVA_OPTS: -Dspring.datasource.password=__C__nj -Xmx64m
    entrypoint: ['sh', '-c']
    command:
      - |
        echo "INFO boot DATABASE_URL=$$DATABASE_URL"
        echo "INFO connecting to $$DATABASE_URL"
        echo "WARN login retry user=ops password=$$APP_PASSWORD"
        echo "DEBUG upstream request headers: Authorization: Bearer $$BEARER_TOKEN"
        echo "INFO 172.18.0.1 GET /oauth/callback?code=abc123&token=$$CALLBACK_TOKEN HTTP/1.1 200"
        echo '{"level":"info","msg":"oauth client loaded","client_secret":"'"$$OAUTH_CLIENT_SECRET"'"}'
        echo "INFO env JAVA_OPTS=$$JAVA_OPTS"
        echo "INFO canary app ready"
        exec sleep 3600

  canary-pg:
    image: postgres:16-alpine
    container_name: __X__-canary-pg
    environment:
      PGHOST: 203.0.113.77,__H__
      PGCONNECT_TIMEOUT: '2'
    entrypoint: ['sleep', '3600']

  canary-dburl:
    image: postgres:16-alpine
    container_name: __X__-canary-dburl
    environment:
      DATABASE_URL: postgresql://sshepherd_ro:__C__du@postgres:5432/fixture?sslmode=disable&application_name=sshepherd-canary
    entrypoint: ['sleep', '3600']

  canary-app:
    <<: *canary-app
    container_name: __X__-canary-app
    network_mode: container:__X__-sshd-debian

  canary-app-alpine:
    <<: *canary-app
    container_name: __X__-canary-app-alpine
    network_mode: container:__X__-sshd-alpine
