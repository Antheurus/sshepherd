# Disposable local fixture for `just smoke` (see scripts/smoke.sh), one compose project,
# `sshepherd-smoke`, so teardown and every docker query can be scoped to it:
#   sshd-debian / sshd-alpine - the ssh targets sshepherd connects to (GNU and busybox userland);
#                  each has the docker CLI mounted against the HOST daemon so it can exec into the
#                  postgres/app containers below. That socket also shows the host's OTHER
#                  containers to `services ps`; assertions must never depend on them.
#   postgres     - a real Postgres, seeded with a read-only role (postgres-init/01-fixture.sql).
#   app          - a minimal long-running nginx standing in for a deployed app.
#
# scripts/smoke.sh sets SSHEPHERD_SMOKE_KEYDIR (an ephemeral generated keypair) and the two host
# ports (SSHEPHERD_SMOKE_DEBIAN_PORT 8422, SSHEPHERD_SMOKE_ALPINE_PORT 8423) before invoking
# `docker compose -p sshepherd-smoke up`.

name: sshepherd-smoke

services:
  postgres:
    image: postgres:16-alpine
    container_name: sshepherd-fixture-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: fixture
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  app:
    image: nginx:alpine
    container_name: sshepherd-fixture-app

  sshd-debian:
    build:
      context: .
      dockerfile: Dockerfile.debian
    container_name: sshepherd-fixture-sshd-debian
    ports:
      - '127.0.0.1:${SSHEPHERD_SMOKE_DEBIAN_PORT:-8422}:22'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SSHEPHERD_SMOKE_KEYDIR:-./.smoke-keys}/authorized_keys:/root/.ssh/authorized_keys:ro
    depends_on:
      - postgres
      - app

  sshd-alpine:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    container_name: sshepherd-fixture-sshd-alpine
    ports:
      - '127.0.0.1:${SSHEPHERD_SMOKE_ALPINE_PORT:-8423}:22'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SSHEPHERD_SMOKE_KEYDIR:-./.smoke-keys}/authorized_keys:/root/.ssh/authorized_keys:ro
    depends_on:
      - postgres
      - app
